overview: The research of my team and collaborators is in the development of Machine Learning methods for analysis and interpretation of images, videos and neurophysiological signals (e.g. EEG). The research is driven by applications in Multimedia Indexing and retrieval, Autonomous Systems and Human Computer Interaction.
items:
- title: Multimodal ML (Vision and Language)
  tag: multimodal-ml
  image: /assets/img/publication_preview/dferclip.png
  desc: This line of work is concerned with learning across modalities, and in particular at the intersections of language and vision, utilising, fine-tuning and adapting large, pre-trained Language and Vision-Language models.
- title: Affective Computing
  tag: affective-computing
  image: https://images.unsplash.com/photo-1634944902853-3e977c2de8b6?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1170&q=80
  desc: This line of research is concerned with the recognition of behaviour, emotions and cognitive states of people by analysing their images, video and neuro-physiological signals. In a recent line of work this extends to the analysis of mental health illnesses, such as schizophrenia and depression.
- title: Generation and Learning
  tag: generation-and-learning
  image: https://github.com/chi0tzp/WarpedGANSpace/raw/master/figs/interpretable_path.png
  desc: This line of research is concerned with learning from generative models and learning to control generation for privacy, interpretability and control purposes. This includes learning representations in the latent space of generative models so as to control local changes, control image generation with natural language and controlling generation so as to anonymise datatasets in order to use them for training machine learning models in a privacy preserving manner. 
- title: Learning with few/no/noisy/uncertain/imprecise annotations
  tag: learning-from-few-samples
  image: https://github.com/MrChenFeng/SSR-An-Efficient-and-Robust-Framework-for-Learning-with-Unknown-Label-Noise_BMVC2022/raw/main/sources/method.png
  desc: This line of research is concerned with learning in the absence of reliable annotations. This includes self-supervised representation learning, unsupervised learning with clustering objectives or learning with labels of different granularity than that of the downstream task.
- title: Video Understanding
  tag: video-understanding
  image: https://github.com/mever-team/distill-and-select/raw/main/dns_overview.png?raw=true
  desc: This line of research is concerned with analysis of video for retrieval, summarisation and activity/action recognition.
