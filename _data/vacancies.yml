    # PhD positions in Multimodal Generative Foundation models

    1 PhD position available for Chinese students supported by the China Scholarship Council (CSC) in Multimodal Generative AI. The research will evolve around Generative AI and AudioVisual Language models, and will focus on long horizon generation, planning and alignment.


    ## Context
    Current generative models excel at short term generations but struggle with long-horizon planning and robust value alignment. This work will investigate structured planning algorithms with advanced alignment techniques, ensuring agents execute complex, multi-step actions that remain highly faithful to human intent. This will be investigated in the context of audio-visual generative models, possibly in the context of conversational foundation models.

    ## Objectives
    We will design planning modules that will enable models to construct, evaluate, and iteratively refine hierarchical plans prior to execution. By separating reasoning from generation, this approach mitigates hallucination and logical drift during sequential decision-making. In addition, we will investigate trajectory-level alignment. Existing RLHF models optimize for short-term proxies, ignoring long-term strategic coherence. We will explore reward shaping mechanisms that evaluate complete action sequences, ensuring all intermediate steps adhere to safety constraints.

    ## Team
    You will be part of the Multimedia and Vision Research group and member of the centre for Multimodal AI. The team you will be involved with is regularly publishing in top conferences and journals, including CVPR, ICCV, ECCV, NeurIPS, TPAMI, IJCV, etc, and has access to computational resources, including a computational server with 64 A100s and exclusive access to 3 A100s and other servers.

    For more information please see [https://ipatras.github.io](https://ipatras.github.io)

    ## Funding
    The applicants should apply separately to the CSC for stipend. For successful applicants, QMUL will provide a full tuition fee waiver.
    
    ## Who can apply
    - Should hold, or is expected to obtain an MSc in Electronic Engineering, Computer Science, or a closely related discipline.
    - Having obtained distinction or first-class level degree is highly desirable.
    - Applicants should satisfy all eligibility criteria set out by the CSC. Please to refer to CSC website for full details: http://www.csc.edu.cn

    ## Application Process
    - At this stage, please, express your interest and address your inquiries by directly emailing me at [i.patras@qmul.ac.uk](mailto:i.patras@qmul.ac.uk) with your CV. Please include in the subject the string **[2026 CSC PhD Application]**
    - At a second stage, **and upon agreement with me**, candidates should be advised to apply online using the standard QMUL research student application form (https://www.qmul.ac.uk/postgraduate/research/applying-for-a-phd/ ), on which they must specify in the funding section that they are making a CSC studentship application.  
    
