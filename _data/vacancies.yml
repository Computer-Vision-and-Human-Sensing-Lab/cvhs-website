- title: PhD position in Machine Learning and Multimodal AI
  deadline: 29/01/2025
  content: |
    # PhD position in Machine Learning and Multimodal AI in Queen Mary University of London

    1 PhD position funded by a China Scholarship Council scholarship in collaboration with Dr. Georgios (Yorgos) Tzimiropoulos in the area of Multimodal Machine Learning and AI. Topics include Generative AI and Vision Language models, for image and video analysis and understanding (e.g, VQA) and Generative AI (e.g., diffusion models) for image/video generation and editing.

    ## Team:
    You will be part of the Multimedia and Vision Research group and member of the centre for Multimodal AI. The team you will be involved with, with Prof. Tzimiropoulos and Prof. Patras, is regularly publishing in top conferences and journals, including CVPR, ICCV, ECCV, NeurIPS, TPAMI, IJCV, etc, and has access to computational resources, including a computational server with 64 A100s and exclusive access to 3 A100s and other servers.

    For more information on our recent works, please see [https://ytzimiro.github.io/](https://ytzimiro.github.io/) and [https://www.eecs.qmul.ac.uk/~ioannisp/](https://www.eecs.qmul.ac.uk/~ioannisp/)

    ## Funding:
    For successful applicants, QMUL will provide a full tuition fee waiver and then the CSC will provide living expenses for 4 years, visa costs and one return flight to the UK.

    ## Application Deadline:
    The deadline for prospective CSC candidates to apply to QMUL is the 29th January 2025 (the expected start date of the PhD is for September 2025). Once applicants have obtained their offer letter from Queen Mary they should then apply to CSC for the scholarship. The CSC usually accepts applications between 10th-31st March. 2025 dates have not yet been confirmed. Instructions to complete this application will be available on the CSC website by the end of the year.

    ## Who can apply:
    Should hold, or is expected to obtain an MSc in the Electronic Engineering, Computer Science, or a closely related discipline

    Having obtained distinction or first-class level degree is highly desirable

    ## Eligibility criteria:
    For eligibility criteria, please to refer to CSC website for full details: [http://www.csc.edu.cn](http://www.csc.edu.cn)

    ## How to apply:
    Please, contact the potential first supervisor and cc me with your CV. Please, include in the subject the string: [2025 CSC PhD Application]

    Apply to QMUL for the scholarship (as instructed in the ‘How to Apply’ section below) by the deadline of 29th January 2025.  [https://www.qmul.ac.uk/postgraduate/research/applying-for-a-phd/](https://www.qmul.ac.uk/postgraduate/research/applying-for-a-phd/)

    Apply to CSC by their deadline.
