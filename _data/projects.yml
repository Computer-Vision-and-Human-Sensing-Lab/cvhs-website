items:
- title: Ai4media
  link: https://www.ai4media.eu/
  image: https://pbs.twimg.com/media/FodSsWiXwAI15mm?format=jpg&name=large
  desc:  Funded under the European Union’s Horizon 2020 research and innovation programme, the project aspires to become a Centre of Excellence engaging a wide network of researchers across Europe and beyond, focusing on delivering the next generation of core AI advances and training to serve the Media sector, while ensuring that the European values of ethical and trustworthy AI are embedded in future AI deployments. QMUL work is focused on representation learning from a) large, pretrained Language and Vision models b) large pretrained Generative Models, and c) from noisy labels, or no labels at all.